services:
  api:
    build: .
    restart: unless-stopped
    environment:
      APP_ENVIRONMENT: development
      APP_REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build: .
    command: python -m app.workers.runner
    restart: unless-stopped
    environment:
      APP_ENVIRONMENT: development
      APP_REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "python -c \"from redis import Redis; Redis.from_url('$$APP_REDIS_URL').ping()\""]
      interval: 10s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
