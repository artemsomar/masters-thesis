[project]
name = "uml-diagram-backend"
version = "0.1.0"
description = "Backend for generating UML use-case diagram models."
authors = [{ name = "Master Thesis" }]
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi (>=0.115,<1.0)",
  "faiss-cpu (>=1.12,<2.0)",
  "google-genai (>=1.33,<2.0)",
  "numpy (>=2.0,<3.0)",
  "pydantic-settings (>=2.7,<3.0)",
  "redis (>=5.2,<7.0)",
  "rq (>=2.3,<3.0)",
  "structlog (>=25.1,<26.0)",
  "uvicorn[standard] (>=0.34,<1.0)",
]

[tool.poetry]
requires-poetry = ">=2.0"
packages = [{ include = "app", from = "src" }]

[dependency-groups]
dev = [
  "black (>=25.1,<26.0)",
  "httpx (>=0.28,<1.0)",
  "mypy (>=1.15,<2.0)",
  "pytest (>=8.3,<10.0)",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
exclude = ["^tests/fakes/"]
namespace_packages = true
explicit_package_bases = true
mypy_path = ["$MYPY_CONFIG_FILE_DIR/src"]

[[tool.mypy.overrides]]
 module = ["faiss.*", "google.*", "rq.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = [
  "unit: isolated business-rule tests",
  "integration: tests using infrastructure adapters",
  "api: HTTP contract tests",
]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
